<article class="product-card">
  <div class="product-card__icon" aria-hidden="true">{{ icon }}</div>
  <h3>{{ title }}</h3>
  <p>{{ description }}</p>
  @if (benefits?.length) {
    <ul>
      @for (benefit of benefits; track benefit) {
        <li>{{ benefit }}</li>
      }
    </ul>
  }
</article>
