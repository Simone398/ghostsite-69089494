<section class="section">
  <div class="container">
    <app-section-header
      title="Dove siamo e come contattarci"
      subtitle="Passa a trovarci di persona o scrivici per informazioni rapide."
    ></app-section-header>
    <div class="contact-grid">
      <div class="contact-info">
        <h3>Indirizzo</h3>
        <p>{{ storeInfo.address }}</p>
        <a class="btn btn--secondary" [href]="storeInfo.mapLink" target="_blank" rel="noopener">
          Apri in Google Maps
        </a>
        <div class="map-embed" id="mappa">
          <iframe
            [src]="safeMapUrl"
            title="Mappa del negozio"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      </div>

      <div class="contact-details">
        <h3>Orari di apertura</h3>
        <table class="hours-table">
          @for (hour of storeInfo.openingHours; track hour.day) {
            <tr>
              <th scope="row">{{ hour.day }}</th>
              <td>{{ hour.hours }}</td>
            </tr>
          }
        </table>

        <h3>Contatti rapidi</h3>
        <div class="contact-links">
          <a [href]="storeInfo.phoneHref">Chiama {{ storeInfo.phone }}</a>
          <a [href]="storeInfo.whatsappLink" target="_blank" rel="noopener"> WhatsApp </a>
          <a [href]="'mailto:' + storeInfo.email">{{ storeInfo.email }}</a>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="section section--muted">
  <div class="container">
    <app-section-header
      title="Scrivici un messaggio"
      subtitle="Rispondiamo il prima possibile. Per urgenze, chiama o usa WhatsApp."
    ></app-section-header>
    <app-contact-form></app-contact-form>
  </div>
</section>

<section class="section">
  <div class="container">
    <app-cta-strip
      title="Ti aspettiamo in negozio!"
      [description]="storeInfo.address + ' - Tel. ' + storeInfo.phone"
      buttonLabel="Apri in Google Maps"
      [buttonLink]="storeInfo.mapLink"
      [buttonExternal]="true"
    ></app-cta-strip>
  </div>
</section>
